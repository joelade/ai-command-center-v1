# Alternative: Integrated Docker Compose with n8n in main stack
# Use this if you want n8n integrated with your other services (Ollama, Open WebUI, Orchestrator)
# Command: docker compose -f docker-compose.integrated.yml up -d

version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ai-command-center-v2-ready-ollama-1
    ports:
      - "11434:11434"
    volumes:
      - ollama:/root/.ollama
      - ./init-models.sh:/docker-entrypoint.d/init-models.sh
    entrypoint: bash /docker-entrypoint.d/init-models.sh
    restart: unless-stopped
    environment:
      - OLLAMA_KEEP_ALIVE=24h
      - PULL_ALL_MODELS=0
    networks:
      - ai-network

  mcp-filesystem:
    image: python:3.11-slim
    container_name: mcp-filesystem
    working_dir: /app
    volumes:
      - ./mcp-data:/app/data
      - ./main.py:/app/main.py
    ports:
      - "3333:3333"
    command: >
      sh -c "pip install fastapi uvicorn && python main.py"
    restart: unless-stopped
    networks:
      - ai-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - ENABLE_RAG=1
      - HF_HUB_DISABLE_TELEMETRY=1
      - ENABLE_MCP=true
      - MCP_SERVERS=http://mcp-filesystem:3333
      - MCP_SERVER_URL=http://mcp-filesystem:3333
      - MCP_ENABLE_FILESYSTEM=true
      - MCP_FILESYSTEM_ROOT=/app/data
    volumes:
      - openwebui:/app/backend/data
    depends_on:
      - ollama
      - mcp-filesystem
    restart: unless-stopped
    networks:
      - ai-network

  postgres:
    image: postgres:16-alpine
    container_name: n8n-postgres
    environment:
      - POSTGRES_USER=${DB_USER:-n8n}
      - POSTGRES_PASSWORD=${DB_PASSWORD:-n8n_password}
      - POSTGRES_DB=${DB_NAME:-n8n}
    volumes:
      - n8n_postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-n8n}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ai-network

  n8n:
    image: n8nio/n8n:latest
    container_name: n8n
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${DB_PASSWORD:-n8n_password}
      - N8N_HOST=n8n
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-data:/data
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ai-network

  qa-orchestrator:
    image: python:3.11-slim
    container_name: qa-orchestrator
    ports:
      - "8000:8000"
    volumes:
      - ./orchestrator:/app
    working_dir: /app
    environment:
      - PYTHONUNBUFFERED=1
      - N8N_BASE_URL=http://n8n:5678
    command: >
      sh -c "pip install -r requirements.txt &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    depends_on:
      - open-webui
      - n8n
    restart: unless-stopped
    networks:
      - ai-network

  qa-dashboard:
    image: python:3.11-slim
    container_name: qa-dashboard
    ports:
      - "8501:8501"
    volumes:
      - ./dashboard:/app
    working_dir: /app
    environment:
      - STREAMLIT_SERVER_HEADLESS=true
      - STREAMLIT_LOGGER_LEVEL=error
      - N8N_BASE_URL=http://n8n:5678
    command: >
      sh -c "pip install -r requirements.txt &&
             streamlit run dashboard.py --server.port=8501 --server.address=0.0.0.0 --logger.level=error"
    depends_on:
      - qa-orchestrator
    restart: unless-stopped
    networks:
      - ai-network

networks:
  ai-network:
    driver: bridge

volumes:
  ollama:
  openwebui:
  n8n_postgres_data:
  n8n_data:
